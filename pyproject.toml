[project]
name = "perception-numpy"
version = "0.1.0"
description = "Briques de perception et de positionnement implémentées avec NumPy, vérifiées par des tests."
requires-python = ">=3.12"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
